[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-business-platform"
version = "0.1.0"
description = "AI Business Intelligence Platform — 35-model bank analytics engine"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",

    # Pydantic & settings
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # Database
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",

    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # Cache / broker
    "redis[hiredis]==5.0.4",

    # Celery
    "celery==5.4.0",
    "flower==2.0.1",

    # ML — core
    "numpy==1.26.4",
    "scipy==1.13.0",
    "scikit-learn==1.4.2",
    "pandas==2.2.2",

    # ML — boosting
    "xgboost==2.0.3",
    "lightgbm==4.3.0",

    # ML — deep learning (LSTM)
    "torch==2.3.0",

    # ML — forecasting
    "prophet==1.1.5",
    "statsmodels==0.14.2",
    "ruptures==1.1.9",

    # ML — spatial
    "shapely==2.0.4",
    "geopandas==0.14.4",
    "osmnx==1.9.3",

    # ML — NLP
    "spacy==3.7.4",

    # Explainability
    "shap==0.45.1",

    # MLflow
    "mlflow==2.12.2",
    "boto3==1.34.100",

    # Observability
    "structlog==24.1.0",
    "prometheus-fastapi-instrumentator==7.0.0",

    # Rate limiting
    "slowapi==0.1.9",

    # Utilities
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "orjson==3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==24.11.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "locust==2.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
